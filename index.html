<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>中学数学 受験基礎トレーニング</title>
<meta name="description" content="中学1〜3年の数学を受験基礎レベルで反復練習できる計算ドリル">
<meta name="theme-color" content="#212a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="計算力ドリル">
<style>
  :root{
    --paper:#FAF7EF;
    --paper-line:#DDD5C0;
    --ink:#212a3d;
    --ink-soft:#5b6274;
    --red:#b53d2e;
    --red-soft:#e7d3ce;
    --teal:#3c6e63;
    --teal-soft:#dbe9e4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:#EFEAE0;
    font-family:"Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink);
    padding:18px;
  }
  .wrap{max-width:1000px;margin:0 auto;}
  .sheet{
    background:var(--paper);
    border:1px solid var(--paper-line);
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    padding:22px 26px 16px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:4px;
    flex-wrap:wrap;
    gap:8px;
  }
  .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--teal);font-weight:700;margin-bottom:2px;}
  h1{margin:0;font-size:24px;letter-spacing:.02em;}
  .meta{text-align:right;font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .meta b{color:var(--ink);}
  .fillline{display:inline-block;min-width:70px;border-bottom:1px solid var(--ink-soft);}

  /* range panel */
  .panel{
    border:1px solid var(--paper-line);
    border-radius:4px;
    margin:16px 0;
    background:#fff;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;cursor:pointer;user-select:none;
  }
  .panel-head h2{font-size:13.5px;margin:0;letter-spacing:.03em;}
  .panel-head .hint{font-size:11px;color:var(--ink-soft);}
  .panel-body{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .panel.collapsed .panel-body{display:none;}
  .grade-col h3{
    font-size:12px;color:var(--teal);border-bottom:1px solid var(--teal-soft);
    padding-bottom:4px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;
  }
  .grade-col h3 button{
    font-size:10px;padding:2px 6px;font-weight:600;border-radius:9px;
    border:1px solid var(--teal);background:transparent;color:var(--teal);
  }
  .cat-item{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;margin:5px 0;line-height:1.4;}
  .cat-item input{margin-top:2px;}

  .topic-box{
    border:1px solid var(--paper-line);border-radius:4px;background:#fff;
    padding:12px 14px;margin:10px 0 16px;
  }
  .topic-box h2{font-size:13.5px;margin:0 0 6px;}
  .topic-box p{font-size:11.5px;color:var(--ink-soft);margin:0 0 8px;}
  .topic-row{display:flex;gap:8px;flex-wrap:wrap;}
  .topic-row input[type=text]{
    flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--paper-line);
    border-radius:3px;font-size:13px;font-family:inherit;
  }
  #topicStatus{font-size:11.5px;color:var(--teal);margin-top:6px;min-height:14px;}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 18px;}
  button{
    font-family:inherit;font-size:13.5px;font-weight:700;padding:9px 16px;
    border-radius:3px;cursor:pointer;border:1.5px solid var(--ink);
    background:var(--ink);color:var(--paper);letter-spacing:.02em;
  }
  button.secondary{background:transparent;color:var(--ink);}
  button.secondary.active{background:var(--red);border-color:var(--red);color:#fff;}
  button.ghost{border-color:var(--paper-line);background:transparent;color:var(--ink-soft);font-weight:600;}
  button.small{padding:7px 12px;font-size:12.5px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  #timer{
    font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;padding:6px 12px;
    border:1.5px dashed var(--ink-soft);border-radius:3px;color:var(--ink);min-width:64px;text-align:center;
  }
  .spacer{flex:1;}

  #grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--paper-line);border-left:1px solid var(--paper-line);}
  .cell{border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);padding:10px 14px 12px;min-height:78px;}
  .cell.custom{background:#fbf6ee;}
  .num{font-weight:700;color:var(--teal);font-size:12px;margin-right:4px;}
  .qtag{font-size:9.5px;color:var(--ink-soft);border:1px solid var(--paper-line);border-radius:9px;padding:1px 7px;margin-left:6px;}
  .cell.custom .qtag{color:var(--red);border-color:var(--red-soft);}
  .qtext{font-size:15px;margin:5px 0 8px;line-height:1.5;white-space:pre-wrap;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;text-align:center;margin:0 1px;font-size:0.86em;line-height:1.15;position:relative;top:0.05em;}
  .frac .fnum{border-bottom:1.2px solid currentColor;padding:0 3px 1px;}
  .frac .fden{padding:1px 3px 0;}
  .worklines{height:20px;border-bottom:1px dotted var(--paper-line);margin-bottom:4px;}
  .answer{display:none;margin-top:6px;padding:7px 10px;background:var(--red-soft);border-left:3px solid var(--red);font-size:12.5px;line-height:1.6;color:#4a2c22;}
  .answer b{color:var(--red);font-size:13.5px;}
  #grid.show-answers .answer{display:block;}
  #grid.show-answers .worklines{display:none;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 10px;font-size:14px;grid-column:1/-1;border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);}
  footer{margin-top:14px;font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;}

  @media print{
    body{background:#fff;padding:0;}
    .sheet{box-shadow:none;border:none;max-width:100%;padding:8mm 10mm;}
    .toolbar,.panel,.topic-box{display:none;}
    .worklines{display:block !important;}
    .answer{display:none !important;}
    @page{size:A4;margin:8mm;}
  }
  body.pdf-capturing{background:#fff;}
  body.pdf-capturing .wrap{max-width:none;}
  body.pdf-capturing .sheet{box-shadow:none;border:none;}
  body.pdf-capturing .toolbar,
  body.pdf-capturing .panel,
  body.pdf-capturing .topic-box,
  body.pdf-capturing #copyStatus{display:none;}
  @media (max-width:700px){
    #grid{grid-template-columns:1fr;}
    .panel-body{grid-template-columns:1fr;}
    header{flex-direction:column;align-items:flex-start;}
    .meta{text-align:left;}
    body{padding:10px;}
    .sheet{padding:14px 14px 12px;}
    h1{font-size:20px;}
    .toolbar{gap:8px;}
    .toolbar .spacer{flex-basis:100%;height:0;}
    .topic-row input[type=text]{min-width:0;width:100%;}
    .qtext{font-size:14px;}
  }
  @media (max-width:420px){
    h1{font-size:18px;}
    .eyebrow{font-size:10px;}
    .meta{font-size:11px;}
    button{padding:10px 12px;font-size:13px;}
    button.small{padding:9px 10px;font-size:12px;}
    #timer{font-size:14px;min-width:56px;}
    .cell{padding:8px 10px 10px;}
    .qtext{font-size:13.5px;}
  }
  @supports (padding: max(0px)){
    body{
      padding-left:max(18px, env(safe-area-inset-left));
      padding-right:max(18px, env(safe-area-inset-right));
      padding-bottom:max(18px, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>
<div class="wrap">
<div class="sheet">
  <header>
    <div>
      <div class="eyebrow">中1〜中3・数学 / 受験基礎トレーニング</div>
      <h1>計算力ドリル</h1>
    </div>
    <div class="meta">
      日付：<span class="fillline"></span>　目標時間：<b>20分</b><br>
      問題数：<b id="qcount">18</b>問　得点：<span class="fillline"></span> / <span id="qcount2">18</span>
    </div>
  </header>

  <div class="panel" id="rangePanel">
    <div class="panel-head" id="panelHead">
      <h2>📋 出題範囲を選ぶ（デフォルト：すべてON）</h2>
      <span class="hint" id="panelToggleLabel">クリックで開閉 ▾</span>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <div class="topic-box">
    <h2>✏️ 授業で出た内容・指定トピックを追加</h2>
    <p>例：「連立方程式の利用（文章題）」「因数分解の応用」など、苦手な範囲や授業で出た内容を入力すると、その内容に合わせた問題を追加できます。</p>
    <div class="topic-row">
      <input type="text" id="topicInput" placeholder="例：一次関数の利用（グラフの読み取り）">
      <button id="topicBtn" class="small">🤖 この内容で問題を追加</button>
    </div>
    <div id="topicStatus"></div>
  </div>

  <div class="toolbar">
    <button id="genBtn">🎲 問題を生成する</button>
    <button id="ansBtn" class="secondary" disabled>📝 解答・解説を見る</button>
    <button id="timerBtn" class="ghost" disabled>⏱ 20分タイマー開始</button>
    <span id="timer" style="display:none;">20:00</span>
    <div class="spacer"></div>
    <button id="copyQBtn" class="ghost" disabled>📋 問題だけコピー</button>
    <button id="copyABtn" class="ghost" disabled>📋 解答だけコピー</button>
    <button id="pdfBtn" class="ghost" disabled>📄 PDFで保存</button>
    <button id="printBtn" class="ghost" disabled>🖨 印刷する</button>
  </div>
  <div id="copyStatus" style="font-size:11.5px;color:var(--teal);min-height:14px;margin:-10px 0 10px;"></div>

  <div id="grid">
    <div class="empty">上の「出題範囲」を確認して「問題を生成する」ボタンを押すと、今日の問題セットがランダムに出題されます。</div>
  </div>

  <footer>
    <span>ねらい：難問を解く力より「時間内に自力で解ききる」感覚を養う。</span>
    <span>基礎計算トレーニング</span>
  </footer>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================= helpers ================= */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randNZ(min,max){let v=0;while(v===0){v=randInt(min,max);}return v;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function sgn(n,withParen){return (n<0 && withParen) ? `(${n})` : `${n}`;}
function pm(n){return n>=0?`+ ${n}`:`− ${Math.abs(n)}`;} // "+ 3" / "− 3", for appending after a term
function simplifySqrt(N){
  for(let k=Math.floor(Math.sqrt(N));k>=1;k--){ if(N % (k*k) === 0) return [k, N/(k*k)]; }
  return [1,N];
}
function sqrtTerm(c,inside){ if(inside===1) return `${c}`; return c===1?`√${inside}`:(c===-1?`−√${inside}`:`${c}√${inside}`); }
function buildPoly(terms){
  let out=''; let first=true;
  terms.forEach(([c,label])=>{
    if(c===0) return;
    const abs=Math.abs(c);
    const coeffStr=(abs===1 && label!=='')?'':abs;
    const term=`${coeffStr}${label}`;
    if(first){ out += (c<0? `−${term}` : `${term}`); first=false; }
    else { out += (c<0? ` − ${term}` : ` + ${term}`); }
  });
  return out || '0';
}
function fracHTML(num,den){ return `<span class="frac"><span class="fnum">${num}</span><span class="fden">${den}</span></span>`; }
function fracStr(n,d){
  const g=gcd(n,d)||1; n/=g; d/=g;
  if(d<0){n=-n;d=-d;}
  if(d===1) return `${n}`;
  const sign = n<0 ? '−' : '';
  return `${sign}${fracHTML(Math.abs(n),d)}`;
}
/* exact fraction arithmetic as [numerator,denominator] pairs */
function fadd(f1,f2){ return [f1[0]*f2[1]+f2[0]*f1[1], f1[1]*f2[1]]; }
function fsub(f1,f2){ return [f1[0]*f2[1]-f2[0]*f1[1], f1[1]*f2[1]]; }
function fmul(f1,f2){ return [f1[0]*f2[0], f1[1]*f2[1]]; }
function fdiv(f1,f2){ return [f1[0]*f2[1], f1[1]*f2[0]]; }
function fsimp(f){ let [n,d]=f; const g=gcd(n,d)||1; n/=g; d/=g; if(d<0){n=-n;d=-d;} return [n,d]; }
function fstr(f){ const [n,d]=fsimp(f); if(d===1) return `${n}`; const sign=n<0?'−':''; return `${sign}${fracHTML(Math.abs(n),d)}`; }
function fracLabel(n,d){
  const [sn,sd]=fsimp([n,d]);
  if(sd===1) return sn<0?`(${sn})`:`${sn}`;
  const absBody=fracHTML(Math.abs(sn),sd);
  const body = sn<0?`−${absBody}`:absBody;
  return sn<0?`(${body})`:body;
}
function fpm(f){ const [n,d]=fsimp(f); const body=d===1?`${Math.abs(n)}`:fracHTML(Math.abs(n),d); return n>=0?`+ ${body}`:`− ${body}`; }
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(n){ return String(n).split('').map(d=>SUP[d]).join(''); }
function xExp(n){ return n<=0?'':(n===1?'x':`x${sup(n)}`); }
function divisorsOf(n){ n=Math.abs(n); const res=[]; for(let i=1;i<=n;i++){ if(n%i===0) res.push(i); } return res; }
function lcm(a,b){ return Math.abs(a*b)/(gcd(a,b)||1); }
function buildFracPoly(terms){
  let out=''; let first=true;
  terms.forEach(([f,label])=>{
    const [n,d]=fsimp(f);
    if(n===0) return;
    const absBody=d===1?`${Math.abs(n)}`:fracHTML(Math.abs(n),d);
    const coeffStr=(Math.abs(n)===1 && d===1 && label!=='')?'':absBody;
    const term=`${coeffStr}${label}`;
    if(first){ out += (n<0?`−${term}`:`${term}`); first=false; }
    else { out += (n<0?` − ${term}`:` + ${term}`); }
  });
  return out||'0';
}
function coefX(c){ return c===1?'x':(c===-1?'−x':`${c}x`); }
function diffStr(x,y){ return `${x} ${y>=0?`− ${y}`:`+ ${Math.abs(y)}`}`; }
function pickVariant(cat){
  const entries = cat.variants.map(v => typeof v==='function' ? {fn:v, w:1} : v);
  const total = entries.reduce((s,e)=>s+e.w,0);
  let r = Math.random()*total;
  for(const e of entries){ if(r<e.w) return e.fn(); r-=e.w; }
  return entries[entries.length-1].fn();
}

/* ================= diagram helpers (SVG) ================= */
const INK='#212a3d', RED='#b53d2e', TEAL='#3c6e63', SOFT='#8a8f9c', FILL='#e7d3ce';
function svgTag(w,h,inner){
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:230px;height:auto;display:block;margin:6px auto;" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function txt(x,y,s,opts){ opts=opts||{}; return `<text x="${x}" y="${y}" font-size="${opts.size||12}" fill="${opts.color||INK}" text-anchor="${opts.anchor||'middle'}" font-family="sans-serif">${s}</text>`; }
function lineEl(x1,y1,x2,y2,opts){ opts=opts||{}; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${opts.color||INK}" stroke-width="${opts.w||1.6}" ${opts.dash?`stroke-dasharray="${opts.dash}"`:''}/>`; }
function circEl(cx,cy,r,opts){ opts=opts||{}; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${opts.fill||'none'}" stroke="${opts.stroke||INK}" stroke-width="${opts.w||1.6}"/>`; }
function dotEl(cx,cy,opts){ opts=opts||{}; return `<circle cx="${cx}" cy="${cy}" r="2.6" fill="${opts.color||INK}"/>`; }

/* --- 三角形の外角 --- */
function drawExteriorAngleTriangle(a,b){
  const A=[100,46], B=[24,170], C=[178,170];
  const D=[A[0]+(A[0]-B[0])*0.32, A[1]+(A[1]-B[1])*0.32]; // extension beyond A, stays within viewBox
  let s='';
  s+=lineEl(B[0],B[1],D[0],D[1],{});
  s+=lineEl(A[0],A[1],C[0],C[1],{});
  s+=lineEl(B[0],B[1],C[0],C[1],{});
  s+=`<circle cx="${A[0]}" cy="${A[1]}" r="2.6" fill="${INK}"/>`;
  s+=dotEl(B[0],B[1]); s+=dotEl(C[0],C[1]);
  s+=txt(A[0]-6,A[1]+16,'A',{size:11}); s+=txt(B[0]-10,B[1]+4,'B',{size:11}); s+=txt(C[0]+10,C[1]+4,'C',{size:11});
  s+=txt(B[0]+30,B[1]-10,`${a}°`,{size:12,color:INK});
  s+=txt(C[0]-30,C[1]-10,`${b}°`,{size:12,color:INK});
  s+=txt(D[0]+16,D[1]+10,'?',{size:14,color:RED});
  return svgTag(200,190,s);
}
/* --- 平行線と角 --- */
function drawParallelLines(ang,type){
  let s='';
  s+=lineEl(15,60,215,60,{});
  s+=lineEl(15,150,215,150,{});
  s+=lineEl(50,20,180,190,{color:INK});
  s+=txt(20,54,'ℓ',{size:11,color:SOFT}); s+=txt(20,146,'m',{size:11,color:SOFT});
  const p1x=50+(60-20)*(130/170), p1y=60;
  const p2x=50+(150-20)*(130/170), p2y=150;
  s+=dotEl(p1x,p1y); s+=dotEl(p2x,p2y);
  s+=txt(p1x+26,p1y-14,`${ang}°`,{size:12});
  if(type==='同位角'){ s+=txt(p2x+26,p2y-14,'?',{size:14,color:RED}); }
  else { s+=txt(p2x-26,p2y+18,'?',{size:14,color:RED}); }
  return svgTag(230,210,s);
}
/* --- 円周角・中心角 --- */
function drawCentralInscribed(centralLabel,inscribedLabel){
  const O=[100,100], r=68;
  const A=[O[0]+r*Math.cos(200*Math.PI/180), O[1]+r*Math.sin(200*Math.PI/180)];
  const B=[O[0]+r*Math.cos(340*Math.PI/180), O[1]+r*Math.sin(340*Math.PI/180)];
  const P=[O[0]+r*Math.cos(90*Math.PI/180), O[1]+r*Math.sin(90*Math.PI/180)];
  let s='';
  s+=circEl(O[0],O[1],r,{});
  s+=lineEl(O[0],O[1],A[0],A[1],{dash:'3,2',color:SOFT});
  s+=lineEl(O[0],O[1],B[0],B[1],{dash:'3,2',color:SOFT});
  s+=lineEl(P[0],P[1],A[0],A[1],{color:RED});
  s+=lineEl(P[0],P[1],B[0],B[1],{color:RED});
  s+=dotEl(O[0],O[1]); s+=dotEl(A[0],A[1]); s+=dotEl(B[0],B[1]); s+=dotEl(P[0],P[1]);
  s+=txt(O[0],O[1]+4,'O',{size:11});
  s+=txt(A[0]-12,A[1]+8,'A',{size:11}); s+=txt(B[0]+12,B[1]+8,'B',{size:11}); s+=txt(P[0],P[1]-10,'P',{size:11});
  s+=txt(O[0],O[1]-20,`${centralLabel}`,{size:12,color:INK});
  s+=txt(P[0],P[1]+20,`${inscribedLabel}`,{size:12,color:RED});
  return svgTag(200,200,s);
}
function drawCircleSameArc(ang1,ang2){
  const O=[100,105], r=68;
  const A=[O[0]+r*Math.cos(200*Math.PI/180), O[1]+r*Math.sin(200*Math.PI/180)];
  const B=[O[0]+r*Math.cos(340*Math.PI/180), O[1]+r*Math.sin(340*Math.PI/180)];
  const P=[O[0]+r*Math.cos(100*Math.PI/180), O[1]+r*Math.sin(100*Math.PI/180)];
  const Q=[O[0]+r*Math.cos(60*Math.PI/180), O[1]+r*Math.sin(60*Math.PI/180)];
  let s='';
  s+=circEl(O[0],O[1],r,{});

/* --- 座標平面グラフ（一次関数・y=ax²） --- */
function clipLine(x1,y1,x2,y2,xmin,xmax,ymin,ymax){
  let t0=0, t1=1; const dx=x2-x1, dy=y2-y1;
  const checks=[[-dx,x1-xmin],[dx,xmax-x1],[-dy,y1-ymin],[dy,ymax-y1]];
  for(const [p,q] of checks){
    if(p===0){ if(q<0) return null; continue; }
    const r=q/p;
    if(p<0){ if(r>t1) return null; if(r>t0) t0=r; }
    else { if(r<t0) return null; if(r<t1) t1=r; }
  }
  return [x1+t0*dx, y1+t0*dy, x1+t1*dx, y1+t1*dy];
}
function makeGraph(xmin,xmax,ymin,ymax,opts){
  opts=opts||{}; const W=230,H=210,pad=20;
  const sx=x=>pad+(x-xmin)/(xmax-xmin)*(W-2*pad);
  const sy=y=>H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad);
  let s='';
  const x0=sx(0), y0=sy(0);
  if(ymin<=0 && 0<=ymax){ s+=lineEl(pad,y0,W-pad,y0,{color:INK,w:1.4}); }
  if(xmin<=0 && 0<=xmax){ s+=lineEl(x0,pad,x0,H-pad,{color:INK,w:1.4}); }
  if(xmin<=0 && 0<=xmax && ymin<=0 && 0<=ymax){ s+=txt(x0-10,y0+13,'O',{size:10,color:SOFT}); }
  if(opts.polygon){
    const pts=opts.polygon.map(([px,py])=>`${sx(px).toFixed(1)},${sy(py).toFixed(1)}`).join(' ');
    s+=`<polygon points="${pts}" fill="${FILL}" fill-opacity="0.7" stroke="none"/>`;
  }
  if(opts.parabola){
    const a=opts.parabola.a; let d='';
    for(let i=0;i<=48;i++){ const xv=xmin+(xmax-xmin)*i/48; let yv=a*xv*xv;
      yv=Math.max(ymin,Math.min(ymax,yv));
      const px=sx(xv), py=sy(yv);
      d+=(d===''?'M':'L')+`${px.toFixed(1)},${py.toFixed(1)} `; }
    s+=`<path d="${d}" fill="none" stroke="${TEAL}" stroke-width="2"/>`;
  }
  (opts.lines||[]).forEach(({slope,intercept})=>{
    const y1=slope*xmin+intercept, y2=slope*xmax+intercept;
    const clipped=clipLine(xmin,y1,xmax,y2,xmin,xmax,ymin,ymax);
    if(clipped){ const [cx1,cy1,cx2,cy2]=clipped;
      s+=lineEl(sx(cx1),sy(cy1),sx(cx2),sy(cy2),{color:RED,w:1.8}); }
  });
  if(opts.segment){
    const {x1,y1,x2,y2}=opts.segment;
    s+=lineEl(sx(x1),sy(y1),sx(x2),sy(y2),{color:RED,w:3});
  }
  (opts.points||[]).forEach(({x,y,label})=>{
    const px=sx(x),py=sy(y);
    s+=dotEl(px,py);
    s+=txt(px+6,py-6,label,{size:10.5,anchor:'start'});
  });
  return svgTag(W,H,s);
}

      a:`${areaQ}cm²`, e:`面積比は相似比の2乗：${m}²:${n}²=${m*m}:${n*n}。${areaP}×${fracHTML(n*n,m*m)}=${areaQ}cm²`}; },
  ()=>{ // 応用：中点連結定理
    const bc=randInt(2,15)*2;
    return {q:`△ABCの辺AB、ACの中点をそれぞれM、Nとする。BC=${bc}cmのとき、MNの長さを求めなさい。`,
      a:`${bc/2}cm`, e:`中点連結定理よりMN=(1/2)BC=(1/2)×${bc}=${bc/2}cm、またMN∥BCである`,
      svg:drawMidpointTriangle(`${bc}cm`,'?')};
  }
]});
CATS.push({id:'enshuu', grade:'中3', label:'円周角の定理', variants:[
  ()=>{ const inscribed=randInt(10,80); const central=inscribed*2;
    return Math.random()<0.5
      ? {q:`円Oにおいて、ある弧に対する中心角が${central}°であるとき、同じ弧に対する円周角の大きさを求めなさい。`, a:`${inscribed}°`, e:`円周角は中心角の半分：${central}°÷2=${inscribed}°`, svg:drawCentralInscribed(`${central}°`,'?')}
      : {q:`円Oにおいて、ある弧に対する円周角が${inscribed}°であるとき、同じ弧に対する中心角の大きさを求めなさい。`, a:`${central}°`, e:`中心角は円周角の2倍：${inscribed}°×2=${central}°`, svg:drawCentralInscribed('?',`${inscribed}°`)};
  },
  ()=>{ const ang=randInt(10,80);
    return {q:`円Oにおいて、同じ弧ABに対する円周角∠APB=${ang}°のとき、円周上の点Qについて∠AQBの大きさを求めなさい。`,
      a:`${ang}°`, e:`同じ弧に対する円周角はすべて等しいから ${ang}°`, svg:drawCircleSameArc(ang,'?')}; },
  ()=>{ // 応用：円に内接する四角形
    const a=randInt(50,130);
    return {q:`円に内接する四角形ABCDにおいて、∠A=${a}°のとき、∠Cの大きさを求めなさい。`,
      a:`${180-a}°`, e:`円に内接する四角形の対角の和は180°なので ∠C=180−${a}=${180-a}°`, svg:drawCyclicQuad(a)};
  }
]});
CATS.push({id:'sanheihou', grade:'中3', label:'三平方の定理', variants:[
  ()=>{ const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[10,24,26],[12,16,20],[9,40,41],[20,21,29]];
    let [a,b,c]=choice(triples); const s=randInt(1,2); a*=s;b*=s;c*=s;
    return {q:`直角三角形の直角をはさむ2辺の長さが${a}cm、${b}cmであるとき、斜辺の長さを求めなさい。`, a:`${c}cm`,
      e:`斜辺²=${a}²+${b}²=${a*a}+${b*b}=${c*c} → 斜辺=${c}cm`, svg:drawRightTriangle(`${a}cm`,`${b}cm`,'?')}; },
  ()=>{ const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[10,24,26],[12,16,20],[9,40,41],[20,21,29]];
    let [a,b,c]=choice(triples); const s=randInt(1,2); a*=s;b*=s;c*=s;
    return {q:`直角三角形の斜辺の長さが${c}cm、他の1辺が${a}cmであるとき、残りの辺の長さを求めなさい。`, a:`${b}cm`,
      e:`残りの辺²=${c}²−${a}²=${c*c}−${a*a}=${b*b} → 残りの辺=${b}cm`, svg:drawRightTriangle(`${a}cm`,'?',`${c}cm`)}; },
  ()=>{ // 応用：座標平面上の2点間の距離
    const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
    const [dx0,dy0,c]=choice(triples);
    const sx=choice([-1,1]), sy=choice([-1,1]);
    const x1=randInt(-6,6), y1=randInt(-6,6);
    const x2=x1+dx0*sx, y2=y1+dy0*sy;
    return {q:`2点A(${x1}, ${y1})、B(${x2}, ${y2})間の距離を求めなさい。`, a:`${c}`,
      e:`距離²=(${diffStr(x2,x1)})²+(${diffStr(y2,y1)})²=${dx0}²+${dy0}²=${dx0*dx0}+${dy0*dy0}=${c*c} → 距離=${c}`,
      svg:makeGraph(Math.min(x1,x2)-2,Math.max(x1,x2)+2,Math.min(y1,y2)-2,Math.max(y1,y2)+2,{points:[{x:x1,y:y1,label:'A'},{x:x2,y:y2,label:'B'}]})};
  },
  ()=>{ // 応用：直方体の対角線
    const list=[[1,2,2,3],[2,3,6,7],[3,4,12,13],[4,4,7,9],[2,6,9,11],[6,6,7,11],[1,4,8,9],[2,10,11,15]];
    const [a,b,c,d]=choice(list);
    return {q:`縦${a}cm、横${b}cm、高さ${c}cmの直方体の対角線の長さを求めなさい。`, a:`${d}cm`,
      e:`対角線²=${a}²+${b}²+${c}²=${a*a}+${b*b}+${c*c}=${d*d} → 対角線=${d}cm`};
  }
]});
CATS.push({id:'hyouhon', grade:'中3', label:'標本調査（推定の計算）', variants:[
  ()=>{ const r=randInt(5,20), k=randInt(3,6), n=k*randInt(2,5); const x=n/k;
    return {q:`袋の中に同じ大きさの白玉がたくさん入っている。ここに同じ大きさの赤玉を${r}個入れてよくかき混ぜた後、${n}個を取り出すと、その中に赤玉が${x}個含まれていた。この袋の中の白玉の数はおよそ何個と推定できるか。`,
      a:`約${r*(k-1)}個`, e:`全体≒${r}×${n}÷${x}=${r*k}個。白玉は${r*k}−${r}=${r*(k-1)}個`}; }
]});
const panelBody=document.getElementById('panelBody');
const GRADES=['中1','中2','中3'];
GRADES.forEach(g=>{
  const col=document.createElement('div');
  col.className='grade-col';
  const cats=CATS.filter(c=>c.grade===g);
  col.innerHTML=`<h3>${g} <button type="button" data-grade="${g}" class="gradeToggle">全ON/OFF</button></h3>`;
  cats.forEach(c=>{
    const row=document.createElement('label');
    row.className='cat-item';
    row.innerHTML=`<input type="checkbox" checked data-cat="${c.id}"><span>${c.label}</span>`;
    col.appendChild(row);
  });
  panelBody.appendChild(col);
});
document.querySelectorAll('.gradeToggle').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const g=btn.dataset.grade;
    const boxes=[...panelBody.querySelectorAll(`input[type=checkbox]`)].filter(cb=>CATS.find(c=>c.id===cb.dataset.cat).grade===g);
    const anyUnchecked=boxes.some(cb=>!cb.checked);
    boxes.forEach(cb=>cb.checked=anyUnchecked);
  });
});
document.getElementById('panelHead').addEventListener('click', ()=>{
  document.getElementById('rangePanel').classList.toggle('collapsed');
});

function getSelectedCats(){
  const checked=[...panelBody.querySelectorAll('input[type=checkbox]:checked')].map(cb=>cb.dataset.cat);
  return CATS.filter(c=>checked.includes(c.id));
}

/* ================= app logic ================= */
const grid=document.getElementById('grid');
const genBtn=document.getElementById('genBtn');
const ansBtn=document.getElementById('ansBtn');
const printBtn=document.getElementById('printBtn');
const pdfBtn=document.getElementById('pdfBtn');
const timerBtn=document.getElementById('timerBtn');
const timerEl=document.getElementById('timer');
const topicBtn=document.getElementById('topicBtn');
const topicInput=document.getElementById('topicInput');
const topicStatus=document.getElementById('topicStatus');
const copyQBtn=document.getElementById('copyQBtn');
const copyABtn=document.getElementById('copyABtn');
const copyStatus=document.getElementById('copyStatus');

let timerInterval=null;
let currentProblems=[]; // {id, custom, tag, q, a, e, svg}
let nextProblemId=1;
const TARGET=20;
const TOPIC_ADD_COUNT=5;
const STATE_KEY='mathDrillState';

function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify({currentProblems, nextProblemId})); }catch(e){}
}
function restoreState(){
  try{
    const raw=localStorage.getItem(STATE_KEY);
    if(!raw) return;
    const data=JSON.parse(raw);
    if(Array.isArray(data.currentProblems) && data.currentProblems.length>0){
      currentProblems=data.currentProblems;
      nextProblemId=data.nextProblemId||(currentProblems.length+1);
      renderGrid();
    }
  }catch(e){}
}

function cellHTML(num, tag, p){
  return `
      <div><span class="num">問${num}</span><span class="qtag">${tag}</span></div>
      <div class="qtext">${p.q}</div>
      ${p.svg||''}
      <div class="worklines"></div>
      <div class="worklines"></div>
      <div class="answer"><b>答え：</b>${p.a}<br>${p.e}</div>
  `;
}

function renderGrid(){
  const wasShowingAnswers = grid.classList.contains('show-answers');
  grid.innerHTML='';
  if(currentProblems.length===0){
    grid.innerHTML='<div class="empty">上の「出題範囲」を確認して「問題を生成する」ボタンを押すと、今日の問題セットがランダムに出題されます。</div>';
  } else {
    currentProblems.forEach((p,i)=>{
      const cell=document.createElement('div');
      cell.className='cell'+(p.custom?' custom':'');
      cell.innerHTML=cellHTML(i+1, p.tag, p);
      grid.appendChild(cell);
    });
  }
  if(wasShowingAnswers) grid.classList.add('show-answers');
  const total=currentProblems.length;
  document.getElementById('qcount').textContent=total;
  document.getElementById('qcount2').textContent=total;
  const hasProblems=total>0;
  ansBtn.disabled=!hasProblems; printBtn.disabled=!hasProblems; pdfBtn.disabled=!hasProblems;
  timerBtn.disabled=!hasProblems; copyQBtn.disabled=!hasProblems; copyABtn.disabled=!hasProblems;
}

function generateSet(){
  const selected=getSelectedCats();
  if(selected.length===0){
    alert('出題範囲が1つも選択されていません。少なくとも1つはチェックしてください。');
    return;
  }
  grid.classList.remove('show-answers');
  ansBtn.classList.remove('active');
  ansBtn.textContent='📝 解答・解説を見る';
  copyStatus.textContent='';

  let queue=[];
  while(queue.length<TARGET){ queue=queue.concat(shuffle(selected)); }
  queue=queue.slice(0,TARGET);

  currentProblems = queue.map(cat=>{
    const p=pickVariant(cat);
    return {id:nextProblemId++, custom:false, tag:`${cat.grade}・${cat.label}`, q:p.q, a:p.a, e:p.e, svg:p.svg||''};
  });
  renderGrid();
  saveState();
}
genBtn.addEventListener('click', generateSet);

ansBtn.addEventListener('click', ()=>{
  const show=!grid.classList.contains('show-answers');
  grid.classList.toggle('show-answers', show);
  ansBtn.classList.toggle('active', show);
  ansBtn.textContent = show ? '🙈 解答・解説をかくす' : '📝 解答・解説を見る';
});
printBtn.addEventListener('click', ()=>window.print());

async function exportPDF(){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    showCopyStatus('PDF機能の読み込みに失敗しました。通信環境をご確認のうえ再読み込みするか、代わりに「🖨 印刷する」から「PDFに保存」をお試しください。', true);
    return;
  }
  pdfBtn.disabled=true;
  const originalLabel=pdfBtn.textContent;
  pdfBtn.textContent='📄 作成中…';
  showCopyStatus('PDFを作成しています…しばらくお待ちください。', false);
  try{
    document.body.classList.add('pdf-capturing');
    await new Promise(r=>setTimeout(r,60));
    const sheet=document.querySelector('.sheet');
    const canvas=await html2canvas(sheet, {scale:Math.min(2, window.devicePixelRatio||1.5), backgroundColor:'#FAF7EF', useCORS:true});
    document.body.classList.remove('pdf-capturing');

    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    const pageW=pdf.internal.pageSize.getWidth();
    const pageH=pdf.internal.pageSize.getHeight();
    const ratio=pageW/canvas.width; // fit to page width; split height across multiple pages instead of shrinking
    const pageCanvasHeightPx=Math.floor(pageH/ratio);
    const totalPages=Math.max(1, Math.ceil(canvas.height/pageCanvasHeightPx));

    for(let i=0;i<totalPages;i++){
      const sliceY=i*pageCanvasHeightPx;
      const sliceH=Math.min(pageCanvasHeightPx, canvas.height-sliceY);
      const pageCanvas=document.createElement('canvas');
      pageCanvas.width=canvas.width;
      pageCanvas.height=sliceH;
      const ctx=pageCanvas.getContext('2d');
      ctx.fillStyle='#FAF7EF';
      ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
      ctx.drawImage(canvas, 0, sliceY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      const imgData=pageCanvas.toDataURL('image/jpeg', 0.92);
      const imgH=sliceH*ratio;
      if(i>0) pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,0,pageW,imgH);
    }

    const dateStr=new Date().toISOString().slice(0,10);
    pdf.save(`math-drill-${dateStr}.pdf`);
    showCopyStatus(totalPages>1 ? `PDFを保存しました（全${totalPages}ページ）。` : 'PDFを保存しました。', false);
  }catch(err){
    console.error(err);
    document.body.classList.remove('pdf-capturing');
    showCopyStatus('PDFの作成に失敗しました。「🖨 印刷する」から「PDFに保存」でも代用できます。', true);
  }finally{
    pdfBtn.disabled=false;
    pdfBtn.textContent=originalLabel;
  }
}
pdfBtn.addEventListener('click', exportPDF);

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){ return false; }
  }
}
function showCopyStatus(msg, isError){
  copyStatus.style.color = isError ? 'var(--red)' : 'var(--teal)';
  copyStatus.textContent = msg;
}
function toPlainText(s){
  return String(s).replace(/<span class="frac"><span class="fnum">(.*?)<\/span><span class="fden">(.*?)<\/span><\/span>/g, '$1/$2');
}
copyQBtn.addEventListener('click', async ()=>{
  if(currentProblems.length===0) return;
  const text = currentProblems.map((p,i)=>`問${i+1}）${toPlainText(p.q)}`).join('\n\n');
  const ok = await copyToClipboard(text);
  showCopyStatus(ok ? '問題（解答なし）をコピーしました。生徒用として貼り付けられます。' : 'コピーに失敗しました。手動で選択してコピーしてください。', !ok);
});
copyABtn.addEventListener('click', async ()=>{
  if(currentProblems.length===0) return;
  const text = currentProblems.map((p,i)=>`問${i+1}）答え：${toPlainText(p.a)}\n解説：${toPlainText(p.e)}`).join('\n\n');
  const ok = await copyToClipboard(text);
  showCopyStatus(ok ? '解答・解説だけをコピーしました。先生用の答案としてお使いください。' : 'コピーに失敗しました。手動で選択してコピーしてください。', !ok);
});

timerBtn.addEventListener('click', ()=>{
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; timerBtn.textContent='⏱ 20分タイマー開始'; return; }
  let remaining=20*60;
  timerEl.style.display='inline-block';
  timerBtn.textContent='⏸ タイマー停止';
  const tick=()=>{
    const m=Math.floor(remaining/60), s=remaining%60;
    timerEl.textContent=`${m}:${s.toString().padStart(2,'0')}`;
    if(remaining<=0){ clearInterval(timerInterval); timerInterval=null; timerEl.textContent='終了！'; timerBtn.textContent='⏱ 20分タイマー開始'; return; }
    remaining--;
  };
  tick();
  timerInterval=setInterval(tick,1000);
});

/* ---------- custom topic via Anthropic API ---------- */
topicBtn.addEventListener('click', async ()=>{
  const topic=topicInput.value.trim();
  if(!topic){ topicStatus.textContent='トピックを入力してください。'; topicStatus.style.color='var(--red)'; return; }
  topicBtn.disabled=true;
  topicStatus.style.color='var(--teal)';
  topicStatus.textContent='問題を作成中…';
  try{
    const prompt=`あなたは日本の中学数学の教師です。中学生（中1〜中3）の受験基礎トレーニング用に、次のトピックに関する基礎〜標準レベルの計算・文章題を${TOPIC_ADD_COUNT}問作成してください。
トピック: 「${topic}」

出力は必ず次のJSON配列の形式のみで、それ以外の文章（説明・前置き・コードブロックの記号）は一切含めないでください。
[
  {"q":"問題文", "a":"簡潔な答え", "e":"簡潔な解説（1〜2文）"},
  ...
]
条件：
- 問題文・答え・解説はすべて日本語。
- 数式の累乗は x² のように上付き文字を使う。分数はできるだけ簡単な形（例: 3/4）で表す。
- 中学生が自力で20分程度のドリルの一部として解けるレベルの難易度にする（難問すぎないこと）。
- 改行が必要な場合は問題文中に \\n を使ってよい。
- 必ずちょうど${TOPIC_ADD_COUNT}問作成すること。`;
    const resp=await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1200,
        messages:[{role:'user', content:prompt}]
      })
    });
    const data=await resp.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    let jsonText=text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const match=jsonText.match(/\[[\s\S]*\]/);
    if(match) jsonText=match[0];
    const items=JSON.parse(jsonText);
    if(!Array.isArray(items) || items.length===0) throw new Error('empty');

    const tag=`指定トピック：${topic}`;
    const newEntries = items.map(p=>({
      id:nextProblemId++, custom:true, tag,
      q:(p.q||'').toString(), a:(p.a||'').toString(), e:(p.e||'').toString(), svg:''
    }));

    // 既存の自動生成分から最大TOPIC_ADD_COUNT問を減らして、合計を一定に保つ
    let removeCount=Math.min(TOPIC_ADD_COUNT, currentProblems.length);
    const autoIdx=[]; const customIdx=[];
    currentProblems.forEach((p,i)=> (p.custom?customIdx:autoIdx).push(i));
    let removeIdx=autoIdx.slice(-removeCount);
    if(removeIdx.length<removeCount){
      removeIdx=removeIdx.concat(customIdx.slice(0, removeCount-removeIdx.length));
    }
    const removeSet=new Set(removeIdx);
    currentProblems=currentProblems.filter((p,i)=>!removeSet.has(i));
    currentProblems=currentProblems.concat(newEntries);

    // 合計が必ずTARGET問になるよう調整（AIの返答数が5問ちょうどでない場合の保険）
    if(currentProblems.length<TARGET){
      const selected=getSelectedCats();
      if(selected.length>0){
        const need=TARGET-currentProblems.length;
        let pool=[]; while(pool.length<need){ pool=pool.concat(shuffle(selected)); }
        pool=pool.slice(0,need);
        const filler=pool.map(cat=>{
          const p=pickVariant(cat);
          return {id:nextProblemId++, custom:false, tag:`${cat.grade}・${cat.label}`, q:p.q, a:p.a, e:p.e, svg:p.svg||''};
        });
        currentProblems=currentProblems.concat(filler);
      }
    } else if(currentProblems.length>TARGET){
      currentProblems=currentProblems.slice(0,TARGET);
    }

    renderGrid();
    saveState();
    topicStatus.style.color='var(--teal)';
    topicStatus.textContent=`「${topic}」の問題を${newEntries.length}問追加しました（既存の問題を${removeIdx.length}問減らして、全体は${currentProblems.length}問です）。`;
  }catch(err){
    console.error(err);
    topicStatus.style.color='var(--red)';
    topicStatus.textContent='問題の作成に失敗しました。もう一度お試しください。';
  }finally{
    topicBtn.disabled=false;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

restoreState();
